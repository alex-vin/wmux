name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          ./scripts/select-ci-xcode.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Download Prebuilt GhosttyKit
        run: |
          export GHOSTTY_SHA="cb1ef7091cdef0b581ee2cbd83742b653253523e"
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build macOS App with xcodebuild
        run: |
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        run: |
          mkdir -p dist
          if [ -d "build/Build/Products/Release/wmux.app" ]; then
            APP_PATH="build/Build/Products/Release/wmux.app"
            APP_NAME="wmux.app"
          else
            APP_PATH="build/Build/Products/Release/cmux.app"
            APP_NAME="cmux.app"
          fi
          
          # Ad-hoc code sign app bundle
          codesign --force --deep -s - "$APP_PATH"
          
          create-dmg \
            --volname "wmux" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 120 \
            --app-drop-link 425 120 \
            --hide-extension "$APP_NAME" \
            dist/wmux-macos-arm64.dmg \
            "$APP_PATH"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmux-macos-arm64-dmg
          path: dist/wmux-macos-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wmux-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
