name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or Release to attach DMG to (e.g. 1.0.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          ./scripts/select-ci-xcode.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install create-dmg
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -fsSL https://raw.githubusercontent.com/create-dmg/create-dmg/v1.3.0/create-dmg -o /usr/local/bin/create-dmg || sudo curl -fsSL https://raw.githubusercontent.com/create-dmg/create-dmg/master/create-dmg -o /usr/local/bin/create-dmg
          sudo chmod +x /usr/local/bin/create-dmg
          create-dmg --version

      - name: Download Prebuilt GhosttyKit
        run: |
          export GHOSTTY_SHA="cb1ef7091cdef0b581ee2cbd83742b653253523e"
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Cargo & Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/Library/Caches/cmux
          key: cargo-cmux-${{ runner.os }}-${{ hashFiles('Native/**/Cargo.lock') }}
          restore-keys: |
            cargo-cmux-${{ runner.os }}-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build macOS App with xcodebuild
        env:
          GIT_TERMINAL_PROMPT: 0
          CARGO_NET_TIMEOUT: 30
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CMUX_SWIFT_FRONTEND_WORKAROUND: 1
          CMUX_SWIFT_DISABLE_GLOBAL_ISEL: 1
        run: |
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xllvm -aarch64-enable-global-isel-at-O=-1' \
            -showBuildTimingSummary \
            build

      - name: Package DMG
        run: |
          mkdir -p dist
          if [ -d "build/Build/Products/Release/wmux.app" ]; then
            APP_PATH="build/Build/Products/Release/wmux.app"
            APP_NAME="wmux.app"
          else
            APP_PATH="build/Build/Products/Release/cmux.app"
            APP_NAME="cmux.app"
          fi
          
          # Ad-hoc code sign app bundle
          codesign --force --deep -s - "$APP_PATH"
          
          create-dmg \
            --volname "wmux" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 120 \
            --app-drop-link 425 120 \
            --hide-extension "$APP_NAME" \
            dist/wmux-macos-arm64.dmg \
            "$APP_PATH"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmux-macos-arm64-dmg
          path: dist/wmux-macos-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          files: dist/wmux-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
