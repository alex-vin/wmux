name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or Release to attach DMG to (e.g. 1.0.1)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize Submodules (Shallow)
        run: |
          git submodule update --init --depth 1 vendor/bonsplit ghostty

      - name: Select Xcode
        run: |
          ./scripts/select-ci-xcode.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin

      - name: Cache create-dmg
        id: cache-create-dmg
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/bin/create-dmg
            /opt/homebrew/share/create-dmg
            /opt/homebrew/Cellar/create-dmg
          key: brew-create-dmg-${{ runner.os }}-v1

      - name: Install create-dmg
        if: steps.cache-create-dmg.outputs.cache-hit != 'true'
        run: |
          brew list create-dmg &>/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          create-dmg --version

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-arm64-${{ runner.os }}-${{ hashFiles('scripts/ghosttykit-checksums.txt') }}

      - name: Download & Thin Prebuilt GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          export GHOSTTY_SHA="cb1ef7091cdef0b581ee2cbd83742b653253523e"
          ./scripts/download-prebuilt-ghosttykit.sh
          # Thin GhosttyKit static library to arm64 and strip debug symbols to speed up linking and reduce cache size
          GHOSTTY_ARCHIVE="GhosttyKit.xcframework/macos-arm64_x86_64/ghostty-internal.a"
          if [ -f "$GHOSTTY_ARCHIVE" ]; then
            if lipo -info "$GHOSTTY_ARCHIVE" 2>/dev/null | grep -q "^Architectures in the fat file:"; then
              echo "⚡ Thinning GhosttyKit static library to arm64 and stripping debug symbols..."
              lipo -thin arm64 "$GHOSTTY_ARCHIVE" -output /tmp/ghostty-arm64.a
              strip -S /tmp/ghostty-arm64.a
              mv /tmp/ghostty-arm64.a "$GHOSTTY_ARCHIVE"
              echo "GhosttyKit thinned and stripped successfully."
            fi
          fi

      - name: Cache Cargo & Rust Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/Library/Caches/cmux
            ~/Library/Caches/wmux
            wmux-tui/target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-

      - name: Cache SwiftPM Packages
        id: cache-spm
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages/checkouts
            build/SourcePackages/artifacts
            build/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Xcode Intermediates & Module Cache
        uses: actions/cache@v4
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/XCBuildData
          key: xcode-intermediates-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'wmux.xcodeproj/project.pbxproj', 'wmux.xcworkspace/contents.xcworkspacedata') }}-${{ github.sha }}
          restore-keys: |
            xcode-intermediates-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'wmux.xcodeproj/project.pbxproj', 'wmux.xcworkspace/contents.xcworkspacedata') }}-
            xcode-intermediates-${{ runner.os }}-

      - name: Sanitize SwiftPM State
        run: |
          # Prevent Xcode crashes caused by cached absolute paths in workspace-state.json
          rm -f build/SourcePackages/workspace-state.json

      - name: Build macOS App with xcodebuild
        env:
          GIT_TERMINAL_PROMPT: 0
          CARGO_NET_TIMEOUT: 30
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CMUX_SWIFT_FRONTEND_WORKAROUND: 1
          CMUX_SWIFT_DISABLE_GLOBAL_ISEL: 1
          CMUX_SKIP_ZIG_BUILD: 1
          WMUX_SWIFT_FRONTEND_WORKAROUND: 1
          WMUX_SWIFT_DISABLE_GLOBAL_ISEL: 1
          WMUX_SKIP_ZIG_BUILD: 1
          XCBUILD_FILE_SYSTEM_MODE: checksum-only
          CLANG_ENABLE_PREFIX_MAPPING: "YES"
          SWIFT_ENABLE_PROJECT_PREFIX_MAPPING: "YES"
        run: |
          SPM_FLAGS=""
          if [ -d "build/SourcePackages/checkouts" ]; then
            echo "Warm SPM cache detected; enabling -skipPackageUpdates"
            SPM_FLAGS="-skipPackageUpdates"
          fi

          NCPU="$(sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          echo "Building with $NCPU parallel jobs..."

          xcodebuild -workspace wmux.xcworkspace \
            -scheme wmux \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            -parallelizeTargets \
            -jobs "$NCPU" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            $SPM_FLAGS \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xllvm -aarch64-enable-global-isel-at-O=-1' \
            -showBuildTimingSummary \
            build

      - name: Prune & Strip App Bundle
        run: |
          if [ -d "build/Build/Products/Release/wmux.app" ]; then
            APP_PATH="build/Build/Products/Release/wmux.app"
          else
            APP_PATH="build/Build/Products/Release/cmux.app"
          fi
          echo "=== Stripping and pruning release bundle at $APP_PATH ==="
          ./scripts/prune-release-bundle.sh "$APP_PATH"
          ./scripts/strip-release-bundle.sh "$APP_PATH"

      - name: Package DMG
        run: |
          mkdir -p dist
          if [ -d "build/Build/Products/Release/wmux.app" ]; then
            APP_PATH="build/Build/Products/Release/wmux.app"
            APP_NAME="wmux.app"
          else
            APP_PATH="build/Build/Products/Release/cmux.app"
            APP_NAME="cmux.app"
          fi
          
          # Codesign inside-out: Mach-O binaries under Contents/Resources/bin are considered resources
          # by `codesign --deep` and will not be re-signed after strip unless signed explicitly first.
          if [ -d "$APP_PATH/Contents/Resources/bin" ]; then
            for bin in "$APP_PATH/Contents/Resources/bin"/*; do
              if [ -f "$bin" ] && [ -x "$bin" ] && file -b "$bin" | grep -q 'Mach-O'; then
                codesign --force -s - "$bin"
              fi
            done
          fi
          codesign --force --deep -s - "$APP_PATH"
          
          rm -f dist/wmux-macos-arm64.dmg dist/rw.*.dmg 2>/dev/null || true

          # Provide hdiutil translation shim for reliable unmount retries in create-dmg
          HDIUTIL_SHIM_DIR="$(mktemp -d)"
          printf '#!/bin/bash\n/usr/bin/hdiutil "$@" 2>&1 | sed -e "s/资源忙/Resource busy/g"\nexit "${PIPESTATUS[0]}"\n' > "$HDIUTIL_SHIM_DIR/hdiutil"
          chmod +x "$HDIUTIL_SHIM_DIR/hdiutil"
          OLD_PATH="$PATH"
          export PATH="$HDIUTIL_SHIM_DIR:$PATH"
          export LC_ALL=C

          create-dmg \
            --volname "wmux" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 120 \
            --app-drop-link 425 120 \
            --hide-extension "$APP_NAME" \
            --hdiutil-retries 10 \
            --overwrite \
            dist/wmux-macos-arm64.dmg \
            "$APP_PATH"

          export PATH="$OLD_PATH"
          rm -rf "$HDIUTIL_SHIM_DIR"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmux-macos-arm64-dmg
          path: dist/wmux-macos-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          files: dist/wmux-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
